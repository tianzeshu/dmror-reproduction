[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmror-reproduction"
version = "0.1.0"
description = "Auditable DM-ROR implementation and explicit synthetic/weak-label datasets"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.4", "scikit-learn>=1.3", "matplotlib>=3.8"]

[project.optional-dependencies]
llm = ["transformers>=4.45,<6", "safetensors>=0.4", "sentencepiece>=0.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dmror*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

